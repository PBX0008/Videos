<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="color-scheme" content="dark light" />
  <title>NCLEX Play</title>
  <link rel="icon" href="assets/favicon.svg?v=6" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="src/styles.css?v=6" />
</head>
<body class="access-pending">

  <section class="access-gate" id="accessGate" aria-labelledby="accessTitle" aria-describedby="accessDescription">
    <div class="access-backdrop" aria-hidden="true"></div>
    <div class="access-card" role="dialog" aria-modal="true">
      <div class="access-brand">
        <img src="assets/logo.svg?v=6" alt="" aria-hidden="true" />
        <span>NCLEX <b>Play</b></span>
      </div>
      <div class="access-lock" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1.5A2.5 2.5 0 0 1 21 12.5v7A2.5 2.5 0 0 1 18.5 22h-13A2.5 2.5 0 0 1 3 19.5v-7A2.5 2.5 0 0 1 5.5 10H7Zm2 0h6V8a3 3 0 0 0-6 0v2Zm-3.5 2A.5.5 0 0 0 5 12.5v7a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.5-.5h-13Zm5.5 2h2v4h-2v-4Z"/></svg>
      </div>
      <p class="access-eyebrow">DEVICE ACTIVATION</p>
      <h1 id="accessTitle">Unlock this device</h1>
      <p id="accessDescription" class="access-description">Enter the current access password. After activation, this browser stays unlocked for two months.</p>
      <form class="access-form" id="accessForm" novalidate>
        <label for="accessPassword">Access password</label>
        <div class="access-input-wrap">
          <input id="accessPassword" name="accessPassword" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="5" placeholder="••••" aria-describedby="accessMessage" required />
          <button id="accessReveal" class="access-reveal" type="button" aria-label="Show password">Show</button>
        </div>
        <p class="access-message" id="accessMessage" role="status" aria-live="polite">Use the four-digit password supplied for activation.</p>
        <button class="access-submit" id="accessSubmit" type="submit">Unlock device</button>
      </form>
      <div class="access-trust"><span aria-hidden="true">✓</span> One activation · This browser · Two months</div>
    </div>
  </section>
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Toggle navigation"></button>
      <a class="brand" href="#home" aria-label="NCLEX Play home">
        <img class="brand-logo" src="assets/logo.svg?v=6" alt="" aria-hidden="true" />
        <span class="brand-text">NCLEX <b>Play</b></span>
      </a>
    </div>

    <form class="search" id="searchForm" role="search">
      <div class="search-field">
        <button class="search-back icon-button" id="searchBack" type="button" aria-label="Close search"></button>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Search videos, playlists and subjects" aria-label="Search videos" />
        <button class="clear-search icon-button" id="clearSearch" type="button" aria-label="Clear search"></button>
      </div>
      <button class="search-submit" type="submit" aria-label="Search"></button>
    </form>

    <div class="topbar-actions">
      <button class="icon-button mobile-search-button" id="mobileSearchButton" type="button" aria-label="Open search"></button>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle theme"></button>
      <button class="profile-button" type="button" aria-label="Profile">N</button>
    </div>
  </header>

  <div class="mobile-shade" id="mobileShade"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Library navigation"></aside>
    <main class="content" id="main" tabindex="-1"></main>
  </div>

  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Mobile navigation">
    <a href="#home" data-nav="home"><span class="bottom-icon" data-icon="home"></span><span>Home</span></a>
    <a href="#search/" data-nav="search"><span class="bottom-icon" data-icon="search"></span><span>Search</span></a>
    <a href="#library" data-nav="library"><span class="bottom-icon" data-icon="library"></span><span>Library</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/library.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest" defer></script>
  <script src="src/app.js?v=6" defer></script>
</body>
</html>
